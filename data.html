<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- build:bnb-rwa-xyz-20261015-1317 -->
  <title>0xMoon专用数据看板</title>
  <style>
    :root {
      --bg: #07080d;
      --fg: #f4f6fb;
      --muted: #9aa3b5;
      --accent: #7c5cff;
      --up: #2ee6a6;
      --down: #ff6b8a;
      --border: rgba(255,255,255,0.1);
      --card: rgba(255,255,255,0.04);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(124,92,255,0.22), transparent 60%),
        radial-gradient(800px 400px at 85% 110%, rgba(46,230,166,0.10), transparent 50%),
        var(--bg);
      color: var(--fg);
    }
    a { color: inherit; text-decoration: none; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(18px);
      background: rgba(7,8,13,0.78);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: stretch;
      gap: 8px;
    }
    .back {
      display: flex;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
      padding: 16px 8px 16px 0;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .back:hover { color: var(--fg); }

    .tabs {
      display: flex;
      flex: 1;
      gap: 4px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 16px 18px;
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color .15s ease, border-color .15s ease;
    }
    .tab:hover { color: var(--fg); }
    .tab.active {
      color: var(--fg);
      border-bottom-color: var(--accent);
    }

    .main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px 48px;
      min-height: 60vh;
    }
    .panel { display: none; }
    .panel.active { display: block; }

    .status {
      padding: 48px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    .status.error { color: var(--down); }
    .status a { color: var(--accent); text-decoration: underline; }

    .hero {
      background: linear-gradient(135deg, rgba(124,92,255,0.18), rgba(46,230,166,0.06));
      border: 1px solid rgba(124,92,255,0.45);
      border-radius: 18px;
      padding: 22px 24px;
      box-shadow: 0 0 0 1px rgba(124,92,255,0.08), 0 20px 50px rgba(0,0,0,0.35);
      margin-bottom: 22px;
    }
    .hero-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .hero-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      letter-spacing: 0.04em;
    }
    .hero-name {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .hero-sub {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }
    .hero-links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .hero-links a {
      font-size: 12px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      transition: color .15s, border-color .15s;
    }
    .hero-links a:hover {
      color: var(--fg);
      border-color: rgba(124,92,255,0.5);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(140px, 1fr));
      gap: 12px;
      width: 100%;
    }
    @media (max-width: 900px) {
      .hero-grid {
        grid-template-columns: repeat(5, minmax(150px, 1fr));
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 4px;
      }
    }
    .metric {
      background: rgba(0,0,0,0.25);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 12px;
      min-width: 0;
    }
    .metric .label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .metric .value {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      word-break: break-all;
    }
    .metric .value.sm { font-size: 16px; }
    .up { color: var(--up); }
    .down { color: var(--down); }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }
    .chip {
      font-size: 12px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
    }
    .chip.up {
      color: var(--up);
      border-color: rgba(46,230,166,0.35);
      background: rgba(46,230,166,0.08);
    }
    .chip.down {
      color: var(--down);
      border-color: rgba(255,107,138,0.35);
      background: rgba(255,107,138,0.08);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      backdrop-filter: blur(10px);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 980px;
    }
    th, td {
      padding: 12px 14px;
      text-align: right;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 11px;

    th:first-child, td:first-child,

    tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: rgba(255,255,255,0.03); }
    tr.highlight-row td {
      background: rgba(124,92,255,0.12);
      border-top: 1px solid rgba(124,92,255,0.35);

    tr.highlight-row td:first-child {

    .rank {
      display: inline-flex;
      align-items: center;

      border-radius: 6px;

    .rank.top {

    .name-cell {

      align-items: center;

    }
    .name-cell a:hover { color: var(--accent); }
    .footnote {
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
    }
    .footnote a { color: var(--accent); }

    .metric-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .metric-head .label { margin-bottom: 0; }
    .metric-rank {

      font-size: 11px;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      border-radius: 999px;

      letter-spacing: 0.02em;

    .subnav {
      display: flex;
      flex-wrap: wrap;

      margin-bottom: 20px;

    .subpanel { display: none; }
    .subpanel.active { display: block; }
    .placeholder-card {
      border: 1px dashed var(--border);
      border-radius: 16px;
      background: var(--card);

    .section-head {
      display: flex;

      align-items: center;

    .table-wrap.compact table { min-width: 560px; }
    .table-wrap.mid table { min-width: 720px; }
    div.stat-card {
      display: block;
      background: rgba(0,0,0,0.25);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 14px 12px;

    .asset-list {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));

    }
    @media (max-width: 1000px) {
      .asset-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .asset-list { grid-template-columns: 1fr; }
    }
    .asset-card {
      background: rgba(0,0,0,0.25);

    }
    .asset-card .ticker {
      font-size: 12px;

    }
    .asset-card .name {

    }

    body.binance-wide .topbar-inner,
    body.binance-wide .main {
      max-width: 1520px;
    }
    .binance-split {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);

    }

      .binance-split {
        grid-template-columns: minmax(0, 1fr);

    }
    .binance-col { min-width: 0; }
    .binance-col .section-head { margin-bottom: 12px; }
    .binance-col .hero-grid {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;

    }
    .binance-col .status { padding: 28px 12px; }
    .col-ext {
      font-size: 12px;

    .table-wrap.cmc table { min-width: 760px; }

    </section>

      <nav class="subnav" role="tablist" aria-label="BNB Chain 分级导航">
        <button class="subtab active" type="button" data-sub="official" role="tab" aria-selected="true">官方数据</button>
        <button class="subtab" type="button" data-sub="rwa" role="tab" aria-selected="false">RWA数据</button>

      </div>

        <div id="bnb-rwa-status" class="status">加载 RWA.xyz 数据中…</div>

  <script>
    var tabs = document.querySelectorAll('.tab');
    var panels = {
      binance: document.getElementById('panel-binance'),
      htx: document.getElementById('panel-htx'),
      bnb: document.getElementById('panel-bnb'),
      tron: document.getElementById('panel-tron')
    };

    function activate(id) {
      tabs.forEach(function (t) {
        var on = t.getAttribute('data-tab') === id;
        t.classList.toggle('active', on);
        t.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      Object.keys(panels).forEach(function (k) {
        panels[k].classList.toggle('active', k === id);
      });
      document.body.classList.toggle('binance-wide', id === 'binance');
      history.replaceState(null, '', '#' + id);
    }

    tabs.forEach(function (t) {
      t.addEventListener('click', function () {
        activate(t.getAttribute('data-tab'));
      });
    });

    var hash = (location.hash || '#binance').slice(1);
    if (hash.indexOf('/') !== -1) hash = hash.split('/')[0];
    if (!panels[hash]) hash = 'binance';
    activate(hash);

    (function initBnbSubnav() {
      var root = document.getElementById('panel-bnb');
      if (!root) return;
      var subtabs = root.querySelectorAll('.subtab');
      var subpanels = {
        official: document.getElementById('bnb-sub-official'),
        rwa: document.getElementById('bnb-sub-rwa'),
        bstocks: document.getElementById('bnb-sub-bstocks'),
        volume: document.getElementById('bnb-sub-volume')
      };
      function activateSub(id) {
        if (!subpanels[id]) id = 'official';
        subtabs.forEach(function (t) {
          var on = t.getAttribute('data-sub') === id;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        Object.keys(subpanels).forEach(function (k) {
          if (subpanels[k]) subpanels[k].classList.toggle('active', k === id);
        });
        if (location.hash.indexOf('bnb') === 1 || location.hash === '#bnb' || !location.hash) {
          history.replaceState(null, '', '#bnb/' + id);
        }
      }
      subtabs.forEach(function (t) {
        t.addEventListener('click', function () {
          activateSub(t.getAttribute('data-sub'));
        });
      });
      var parts = (location.hash || '').replace(/^#/, '').split('/');
      if (parts[0] === 'bnb' && parts[1]) activateSub(parts[1]);
      else activateSub('official');
    })();

    function fmtUsd(n) {
      if (n == null || !isFinite(n)) return '—';
      var abs = Math.abs(n);
      var sign = n < 0 ? '-' : '';
      if (abs >= 1e12) return sign + '$' + (abs / 1e12).toFixed(2) + 't';
      if (abs >= 1e9) return sign + '$' + (abs / 1e9).toFixed(2) + 'b';
      if (abs >= 1e6) return sign + '$' + (abs / 1e6).toFixed(2) + 'm';
      if (abs >= 1e3) return sign + '$' + (abs / 1e3).toFixed(2) + 'k';
      return sign + '$' + abs.toFixed(0);
    }

    function fmtInflow(n) {
      if (n == null || !isFinite(n)) return { text: '—', cls: '' };
      var text = (n > 0 ? '+' : '') + fmtUsd(n);
      var cls = n > 0 ? 'up' : (n < 0 ? 'down' : '');
      return { text: text, cls: cls };
    }

    function matchKeys(c, keys) {
      var name = (c.name || '').toLowerCase();
      var slug = (c.slug || '').toLowerCase();
      for (var i = 0; i < keys.length; i++) {
        var k = keys[i];
        if (name === k || name.indexOf(k) !== -1 || slug === k || slug.indexOf(k) !== -1) {
          return true;
        }
      }
      return false;
    }

    function isBinance(c) { return matchKeys(c, ['binance']); }
    function isHtx(c) { return matchKeys(c, ['htx', 'huobi']); }

    function fieldVal(c, key) {
      var v = c[key];
      return (v == null || !isFinite(v)) ? null : v;
    }

    function rankByField(cexs, key, target) {
      var scored = [];
      for (var i = 0; i < cexs.length; i++) {
        var v = fieldVal(cexs[i], key);
        if (v == null) continue;
        scored.push({ c: cexs[i], v: v });
      }
      scored.sort(function (a, b) { return b.v - a.v; });
      for (var j = 0; j < scored.length; j++) {
        if (scored[j].c === target || (target && scored[j].c.name === target.name && scored[j].c.slug === target.slug)) {
          return j + 1;
        }
      }
      // identity fallback via match
      return null;
    }

    function rankByFieldMatch(cexs, key, matchFn) {
      var scored = [];
      for (var i = 0; i < cexs.length; i++) {
        var v = fieldVal(cexs[i], key);
        if (v == null) continue;
        scored.push({ c: cexs[i], v: v });
      }
      scored.sort(function (a, b) { return b.v - a.v; });
      for (var j = 0; j < scored.length; j++) {
        if (matchFn(scored[j].c)) return j + 1;
      }
      return null;
    }

    function metricHtml(label, valueHtml, rank) {

          return r.json();

    function formatBscValueZh(v) {
      if (v == null) return '—';
      return String(v)
        .replace(/Million/g, '百万')
        .replace(/\bM\b/g, '百万')
        .replace(/USD/g, '美元');
    }

    function renderBnbOfficial(data, sourceNote) {
      var status = document.getElementById('bnb-official-status');

      if (!status || !content || !data || !data.metrics) return;

      var priceCls = data.bnbPriceDir === 'up' ? 'up' : (data.bnbPriceDir === 'down' ? 'down' : '');
      var priceChange = data.bnbPriceChange || '';
      var cards = data.metrics.map(function (m) {
        var metaParts = [];
        if (m.tps) metaParts.push(m.tps + ' TPS');
        if (m.note) metaParts.push(m.note);
        if (m.change) {
          var chCls = m.changeDir === 'up' ? 'up' : (m.changeDir === 'down' ? 'down' : '');
          metaParts.push('<span class="' + chCls + '">' + (m.changeDir === 'up' ? '↑' : (m.changeDir === 'down' ? '↓' : '')) + m.change + '</span>');
        }
        var meta = metaParts.length ? '<div class="meta">' + metaParts.join(' · ') + '</div>' : '';
        var href = m.href || 'https://bscscan.com/charts';
        return (
          '<a class="stat-card" href="' + href + '" target="_blank" rel="noopener">' +
            '<div class="label">' + (m.labelZh || m.key) + '</div>' +
            '<div class="value">' + formatBscValueZh(m.valueZh || m.value) + '</div>' +
            meta +
          '</a>'
        );
      }).join('');

      content.innerHTML =
        '<div class="panel-head">' +
          '<div>' +
            '<h2>BNB Chain 官方数据</h2>' +

    function fmtChangeSpan(item) {
      if (!item || !item.change) return '';
      var cls = item.changeDir === 'up' ? 'up' : (item.changeDir === 'down' ? 'down' : '');
      var arrow = item.changeDir === 'up' ? '↑' : (item.changeDir === 'down' ? '↓' : '');
      var period = item.period ? (' · ' + item.period) : '';
      return '<div class="meta"><span class="' + cls + '">' + arrow + item.change + '</span>' + period + '</div>';
    }

    function rwaStatCards(items, href) {
      return (items || []).map(function (m) {
        return (
          '<a class="stat-card" href="' + (href || 'https://app.rwa.xyz/') + '" target="_blank" rel="noopener">' +
            '<div class="label">' + (m.labelZh || '') + '</div>' +
            '<div class="value">' + (m.value || '—') + '</div>' +
            fmtChangeSpan(m) +
          '</a>'
        );
      }).join('');
    }

    var CMC_FLOW_API = 'https://api.coinmarketcap.com/data-api/v3/exchange-asset/flow/list?convertId=2781&start=1&limit=100&sortBy=exchangeRank&sortType=asc';
    var CMC_CHART_URL = 'https://coinmarketcap.com/zh/charts/exchange-inflows-outflows/';

    function escHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function isCmcBinance(row) {
      var slug = (row && row.slug ? String(row.slug) : '').toLowerCase();
      var name = (row && row.name ? String(row.name) : '').toLowerCase();
      return slug === 'binance' || name === 'binance';
    }

    function cmcChartLink() {
      return '<a href="' + CMC_CHART_URL + '" target="_blank" rel="noopener">CoinMarketCap 交易所流入流出</a>';
    }

    function cmcRowsFrom(data) {
      if (!data) return [];
      if (data.data && Array.isArray(data.data.flowList)) return data.data.flowList;
      if (Array.isArray(data.exchanges)) return data.exchanges;
      if (Array.isArray(data.flowList)) return data.flowList;
      return [];
    }

    function renderCmcFlows(data, sourceKind) {
      var status = document.getElementById('cmc-flow-status');
      var content = document.getElementById('cmc-flow-content');
      if (!status || !content) return false;
      var list = cmcRowsFrom(data);
      if (!list.length) return false;

      var updatedAt = '';
      if (sourceKind === 'live') {
        updatedAt = (data && data.status && data.status.timestamp) || '';
      } else {
        updatedAt = (data && data.updatedAt) || '';
      }

      var rows = list.map(function (c) {
        var highlight = isCmcBinance(c);
        var f24 = fmtInflow(c.netFlow24hUsd);
        var f7 = fmtInflow(c.netFlow7dUsd);
        var f30 = fmtInflow(c.netFlow30dUsd);
        var slug = c.slug ? String(c.slug) : '';
        var name = escHtml(c.name || '—');
        var exUrl = slug ? ('https://coinmarketcap.com/exchanges/' + encodeURIComponent(slug) + '/') : '';
        var nameHtml = exUrl
          ? '<a href="' + exUrl + '" target="_blank" rel="noopener">' + name + '</a>'
          : name;
        var sourceHtml = exUrl
          ? '<a href="' + exUrl + '#reserve" target="_blank" rel="noopener">查看储备</a>'
          : '—';
        var rank = (c.exchangeRank != null && isFinite(c.exchangeRank)) ? c.exchangeRank : '—';
        var rankClass = 'rank' + (rank === 1 || highlight ? ' top' : '');
        return (
          '<tr class="' + (highlight ? 'highlight-row' : '') + '">' +
            '<td><span class="' + rankClass + '">' + rank + '</span></td>' +
            '<td><div class="name-cell">' + nameHtml + (highlight ? ' <span class="badge">币安</span>' : '') + '</div></td>' +
            '<td>' + fmtUsd(c.totalAsset) + '</td>' +
            '<td class="' + f24.cls + '">' + f24.text + '</td>' +
            '<td class="' + f7.cls + '">' + f7.text + '</td>' +
            '<td class="' + f30.cls + '">' + f30.text + '</td>' +
            '<td>' + fmtUsd(c.openInterestUsd) + '</td>' +
            '<td>' + sourceHtml + '</td>' +
          '</tr>'
        );
      }).join('');

      var note;
      if (sourceKind === 'live') {
        note = '数据来自 ' + cmcChartLink() + ' · 实时接口' + (updatedAt ? ' · ' + escHtml(updatedAt) : '');
      } else if (sourceKind === 'file') {
        note = '浏览器跨域无法直连 CoinMarketCap，已显示快照 ' + escHtml(updatedAt) + ' · 来源 ' + cmcChartLink();
      } else {
        note = '浏览器跨域无法直连 CoinMarketCap，已显示内嵌快照 ' + escHtml(updatedAt) + ' · 来源 ' + cmcChartLink();
      }

      content.innerHTML =
        '<div class="table-wrap cmc">' +
          '<table>' +
            '<thead><tr>' +
              '<th>#</th><th>交易所</th><th>总资产</th>' +
              '<th>24小时净流入</th><th>7日净流入</th><th>30日净流入</th>' +
              '<th>合约持仓</th><th>来源</th>' +
            '</tr></thead>' +
            '<tbody>' + rows + '</tbody>' +
          '</table>' +
        '</div>' +
        '<p class="footnote">' + note + '</p>';

      status.hidden = true;
      content.hidden = false;
      return true;
    }

    function showCmcError() {
      var status = document.getElementById('cmc-flow-status');
      var content = document.getElementById('cmc-flow-content');
      if (content) content.hidden = true;
      if (!status) return;
      status.hidden = false;
      status.className = 'status error';
      status.innerHTML = 'CoinMarketCap 流入流出加载失败。请打开 ' + cmcChartLink();
    }

    function loadCmcSnapshotFile() {
      return fetch('cmc-exchange-flows-snapshot.json?t=' + Date.now())
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (data) {
          if (!renderCmcFlows(data, 'file')) throw new Error('empty snapshot');
        });
    }

    function loadCmcEmbedded() {
      if (typeof CMC_FLOWS_SNAPSHOT !== 'undefined' && renderCmcFlows(CMC_FLOWS_SNAPSHOT, 'embedded')) {
        return;
      }
      showCmcError();
    }

    function loadCmcFlows() {
      var status = document.getElementById('cmc-flow-status');
      var content = document.getElementById('cmc-flow-content');
      if (status) {
        status.hidden = false;
        status.className = 'status';
        status.textContent = '正在从 CoinMarketCap 拉取…';
      }
      if (content) content.hidden = true;

      // Public chart JSON. GitHub Pages is blocked by CORS (ACAO is only
      // https://coinmarketcap.com). On failure, use the checked-in snapshot.
      // Refresh: python3 scripts/refresh-cmc-exchange-flows.py
      fetch(CMC_FLOW_API, { method: 'GET', mode: 'cors', credentials: 'omit' })
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (data) {
          if (!renderCmcFlows(data, 'live')) throw new Error('empty');
        })
        .catch(function () {
          if (status) status.textContent = '正在读取 CoinMarketCap 快照…';
          loadCmcSnapshotFile().catch(function () {
            loadCmcEmbedded();
          });
        });
    }
