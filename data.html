<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>谢了也没用，乖儿子</title>
  <style>
    :root {
      --bg: #07080d;
      --fg: #f4f6fb;
      --muted: #9aa3b5;
      --accent: #7c5cff;
      --border: rgba(255,255,255,0.1);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      font-family: "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(124,92,255,0.25), transparent 60%),
        radial-gradient(800px 400px at 20% 100%, rgba(46,230,166,0.1), transparent 50%),
        var(--bg);
      color: var(--fg);
    }
    .wrap {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .hero {
      width: min(720px, 100%);
      text-align: center;
      padding: 56px 28px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      backdrop-filter: blur(16px);
      box-shadow: 0 30px 80px rgba(0,0,0,0.45);
    }
    h1 {
      margin: 0 0 28px;
      font-size: clamp(28px, 6vw, 48px);
      line-height: 1.2;
      letter-spacing: 0.02em;
      font-weight: 700;
    }
    a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      border-bottom: 1px solid transparent;
    }
    a:hover { color: var(--fg); border-bottom-color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>谢了也没用，乖儿子</h1>
      <a href="index.html">← 回首页</a>
    </div>
  </div>
</body>
</html>
