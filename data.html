<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- build:bnb-subnav-20261014-2149 -->
  <title>0xMoon专用数据看板</title>
  <style>
    :root {
      --bg: #07080d;
      --fg: #f4f6fb;
      --muted: #9aa3b5;
      --accent: #7c5cff;
      --up: #2ee6a6;
      --down: #ff6b8a;
      --border: rgba(255,255,255,0.1);
      --card: rgba(255,255,255,0.04);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(124,92,255,0.22), transparent 60%),
        radial-gradient(800px 400px at 85% 110%, rgba(46,230,166,0.10), transparent 50%),
        var(--bg);
      color: var(--fg);
    }
    a { color: inherit; text-decoration: none; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(18px);
      background: rgba(7,8,13,0.78);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: stretch;
      gap: 8px;
    }
    .back {
      display: flex;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
      padding: 16px 8px 16px 0;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .back:hover { color: var(--fg); }

    .tabs {
      display: flex;
      flex: 1;
      gap: 4px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 16px 18px;
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color .15s ease, border-color .15s ease;
    }
    .tab:hover { color: var(--fg); }
    .tab.active {
      color: var(--fg);
      border-bottom-color: var(--accent);
    }

    .main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px 48px;
      min-height: 60vh;
    }
    .panel { display: none; }
    .panel.active { display: block; }

    .status {
      padding: 48px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    .status.error { color: var(--down); }
    .status a { color: var(--accent); text-decoration: underline; }

    .hero {
      background: linear-gradient(135deg, rgba(124,92,255,0.18), rgba(46,230,166,0.06));
      border: 1px solid rgba(124,92,255,0.45);
      border-radius: 18px;
      padding: 22px 24px;
      box-shadow: 0 0 0 1px rgba(124,92,255,0.08), 0 20px 50px rgba(0,0,0,0.35);
      margin-bottom: 22px;
    }
    .hero-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .hero-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      letter-spacing: 0.04em;
    }
    .hero-name {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .hero-sub {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }
    .hero-links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .hero-links a {
      font-size: 12px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      transition: color .15s, border-color .15s;
    }
    .hero-links a:hover {
      color: var(--fg);
      border-color: rgba(124,92,255,0.5);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(140px, 1fr));
      gap: 12px;
      width: 100%;
    }
    @media (max-width: 900px) {
      .hero-grid {
        grid-template-columns: repeat(5, minmax(150px, 1fr));
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 4px;
      }
    }
    .metric {
      background: rgba(0,0,0,0.25);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 12px;
      min-width: 0;
    }
    .metric .label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .metric .value {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      word-break: break-all;
    }
    .metric .value.sm { font-size: 16px; }
    .up { color: var(--up); }
    .down { color: var(--down); }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }
    .chip {
      font-size: 12px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
    }
    .chip.up {
      color: var(--up);
      border-color: rgba(46,230,166,0.35);
      background: rgba(46,230,166,0.08);
    }
    .chip.down {
      color: var(--down);
      border-color: rgba(255,107,138,0.35);
      background: rgba(255,107,138,0.08);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      backdrop-filter: blur(10px);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 980px;
    }
    th, td {
      padding: 12px 14px;
      text-align: right;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: rgba(0,0,0,0.25);
      position: sticky;
      top: 0;
    }
    th:first-child, td:first-child,
    th:nth-child(2), td:nth-child(2) {
      text-align: left;
    }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: rgba(255,255,255,0.03); }
    tr.highlight-row td {
      background: rgba(124,92,255,0.12);
      border-top: 1px solid rgba(124,92,255,0.35);
      border-bottom: 1px solid rgba(124,92,255,0.35);
      font-weight: 700;
    }
    tr.highlight-row td:first-child {
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .rank {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      background: rgba(255,255,255,0.06);
    }
    .rank.top {
      background: var(--accent);
      color: #fff;
    }
    .name-cell {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .name-cell a:hover { color: var(--accent); }
    .footnote {
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
    }
    .footnote a { color: var(--accent); }

    .metric-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .metric-head .label { margin-bottom: 0; }
    .metric-rank {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      border-radius: 999px;
      padding: 2px 8px;
      letter-spacing: 0.02em;
    }

    .subnav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255,255,255,0.03);
    }
    .subtab {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 14px;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: color .15s, background .15s, border-color .15s;
    }
    .subtab:hover { color: var(--fg); background: rgba(255,255,255,0.04); }
    .subtab.active {
      color: var(--fg);
      background: rgba(124,92,255,0.18);
      border-color: rgba(124,92,255,0.45);
    }
    .subpanel { display: none; }
    .subpanel.active { display: block; }
    .placeholder-card {
      border: 1px dashed var(--border);
      border-radius: 16px;
      background: var(--card);
      padding: 36px 24px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }
    .placeholder-card strong {
      display: block;
      color: var(--fg);
      font-size: 16px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="back" href="index.html">← 回首页</a>
      <nav class="tabs" role="tablist">
        <button class="tab active" type="button" data-tab="binance" role="tab" aria-selected="true">币安</button>
        <button class="tab" type="button" data-tab="htx" role="tab" aria-selected="false">火币</button>
        <button class="tab" type="button" data-tab="bnb" role="tab" aria-selected="false">BNB Chain</button>
        <button class="tab" type="button" data-tab="tron" role="tab" aria-selected="false">TRON</button>
      </nav>
    </div>
  </header>

  <main class="main">
    <section class="panel active" id="panel-binance" role="tabpanel">
      <div class="status" id="binance-status">加载 DefiLlama 数据中…</div>
      <div id="binance-content" hidden></div>
    </section>
    <section class="panel" id="panel-htx" role="tabpanel">
      <div class="status" id="htx-status">加载 DefiLlama 数据中…</div>
      <div id="htx-content" hidden></div>
    </section>
    <section class="panel" id="panel-bnb" role="tabpanel">
      <nav class="subnav" role="tablist" aria-label="BNB Chain 分级导航">
        <button class="subtab active" type="button" data-sub="official" role="tab" aria-selected="true">官方数据</button>
        <button class="subtab" type="button" data-sub="rwa" role="tab" aria-selected="false">RWA数据</button>
        <button class="subtab" type="button" data-sub="bstocks" role="tab" aria-selected="false">bStocks数据</button>
        <button class="subtab" type="button" data-sub="volume" role="tab" aria-selected="false">交易量数据</button>
      </nav>
      <div class="subpanel active" id="bnb-sub-official" role="tabpanel">
        <div class="placeholder-card">
          <strong>官方数据</strong>
          占位区 · 后续接入 BNB Chain 官方链上 / 生态指标
        </div>
      </div>
      <div class="subpanel" id="bnb-sub-rwa" role="tabpanel">
        <div class="placeholder-card">
          <strong>RWA数据</strong>
          占位区 · 后续接入 BNB Chain RWA 相关数据
        </div>
      </div>
      <div class="subpanel" id="bnb-sub-bstocks" role="tabpanel">
        <div class="placeholder-card">
          <strong>bStocks数据</strong>
          占位区 · 后续接入 bStocks 相关数据
        </div>
      </div>
      <div class="subpanel" id="bnb-sub-volume" role="tabpanel">
        <div class="placeholder-card">
          <strong>交易量数据</strong>
          占位区 · 后续接入 BNB Chain 交易量数据
        </div>
      </div>
    </section>
    <section class="panel" id="panel-tron" role="tabpanel"></section>
  </main>

  <script>
    var tabs = document.querySelectorAll('.tab');
    var panels = {
      binance: document.getElementById('panel-binance'),
      htx: document.getElementById('panel-htx'),
      bnb: document.getElementById('panel-bnb'),
      tron: document.getElementById('panel-tron')
    };

    function activate(id) {
      tabs.forEach(function (t) {
        var on = t.getAttribute('data-tab') === id;
        t.classList.toggle('active', on);
        t.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      Object.keys(panels).forEach(function (k) {
        panels[k].classList.toggle('active', k === id);
      });
      history.replaceState(null, '', '#' + id);
    }

    tabs.forEach(function (t) {
      t.addEventListener('click', function () {
        activate(t.getAttribute('data-tab'));
      });
    });

    var hash = (location.hash || '#binance').slice(1);
    if (hash.indexOf('/') !== -1) hash = hash.split('/')[0];
    if (!panels[hash]) hash = 'binance';
    activate(hash);

    (function initBnbSubnav() {
      var root = document.getElementById('panel-bnb');
      if (!root) return;
      var subtabs = root.querySelectorAll('.subtab');
      var subpanels = {
        official: document.getElementById('bnb-sub-official'),
        rwa: document.getElementById('bnb-sub-rwa'),
        bstocks: document.getElementById('bnb-sub-bstocks'),
        volume: document.getElementById('bnb-sub-volume')
      };
      function activateSub(id) {
        if (!subpanels[id]) id = 'official';
        subtabs.forEach(function (t) {
          var on = t.getAttribute('data-sub') === id;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        Object.keys(subpanels).forEach(function (k) {
          if (subpanels[k]) subpanels[k].classList.toggle('active', k === id);
        });
        if (location.hash.indexOf('bnb') === 1 || location.hash === '#bnb' || !location.hash) {
          history.replaceState(null, '', '#bnb/' + id);
        }
      }
      subtabs.forEach(function (t) {
        t.addEventListener('click', function () {
          activateSub(t.getAttribute('data-sub'));
        });
      });
      var parts = (location.hash || '').replace(/^#/, '').split('/');
      if (parts[0] === 'bnb' && parts[1]) activateSub(parts[1]);
      else activateSub('official');
    })();

    function fmtUsd(n) {
      if (n == null || !isFinite(n)) return '—';
      var abs = Math.abs(n);
      var sign = n < 0 ? '-' : '';
      if (abs >= 1e12) return sign + '$' + (abs / 1e12).toFixed(2) + 't';
      if (abs >= 1e9) return sign + '$' + (abs / 1e9).toFixed(2) + 'b';
      if (abs >= 1e6) return sign + '$' + (abs / 1e6).toFixed(2) + 'm';
      if (abs >= 1e3) return sign + '$' + (abs / 1e3).toFixed(2) + 'k';
      return sign + '$' + abs.toFixed(0);
    }

    function fmtInflow(n) {
      if (n == null || !isFinite(n)) return { text: '—', cls: '' };
      var text = (n > 0 ? '+' : '') + fmtUsd(n);
      var cls = n > 0 ? 'up' : (n < 0 ? 'down' : '');
      return { text: text, cls: cls };
    }

    function matchKeys(c, keys) {
      var name = (c.name || '').toLowerCase();
      var slug = (c.slug || '').toLowerCase();
      for (var i = 0; i < keys.length; i++) {
        var k = keys[i];
        if (name === k || name.indexOf(k) !== -1 || slug === k || slug.indexOf(k) !== -1) {
          return true;
        }
      }
      return false;
    }

    function isBinance(c) { return matchKeys(c, ['binance']); }
    function isHtx(c) { return matchKeys(c, ['htx', 'huobi']); }

    function fieldVal(c, key) {
      var v = c[key];
      return (v == null || !isFinite(v)) ? null : v;
    }

    function rankByField(cexs, key, target) {
      var scored = [];
      for (var i = 0; i < cexs.length; i++) {
        var v = fieldVal(cexs[i], key);
        if (v == null) continue;
        scored.push({ c: cexs[i], v: v });
      }
      scored.sort(function (a, b) { return b.v - a.v; });
      for (var j = 0; j < scored.length; j++) {
        if (scored[j].c === target || (target && scored[j].c.name === target.name && scored[j].c.slug === target.slug)) {
          return j + 1;
        }
      }
      // identity fallback via match
      return null;
    }

    function rankByFieldMatch(cexs, key, matchFn) {
      var scored = [];
      for (var i = 0; i < cexs.length; i++) {
        var v = fieldVal(cexs[i], key);
        if (v == null) continue;
        scored.push({ c: cexs[i], v: v });
      }
      scored.sort(function (a, b) { return b.v - a.v; });
      for (var j = 0; j < scored.length; j++) {
        if (matchFn(scored[j].c)) return j + 1;
      }
      return null;
    }

    function metricHtml(label, valueHtml, rank) {
      var rankHtml = rank != null
        ? '<span class="metric-rank">第' + rank + '名</span>'
        : '<span class="metric-rank" style="opacity:.45">—</span>';
      return (
        '<div class="metric">' +
          '<div class="metric-head"><div class="label">' + label + '</div>' + rankHtml + '</div>' +
          '<div class="value' + (label === '资产' || label === '净资产' ? '' : ' sm') + '">' + valueHtml + '</div>' +
        '</div>'
      );
    }

    function renderCexPanel(opts, cexs) {
      var status = document.getElementById(opts.panelId + '-status');
      var content = document.getElementById(opts.panelId + '-content');
      if (!status || !content) return;

      var ranked = cexs.slice().sort(function (a, b) {
        var av = a.cleanAssetsTvl != null ? a.cleanAssetsTvl : (a.currentTvl || 0);
        var bv = b.cleanAssetsTvl != null ? b.cleanAssetsTvl : (b.currentTvl || 0);
        return bv - av;
      });

      var trueRankMap = {};
      for (var ri = 0; ri < ranked.length; ri++) {
        trueRankMap[ranked[ri].name + '|' + (ranked[ri].slug || '')] = ri + 1;
      }

      var target = null;
      var targetRank = -1;
      for (var i = 0; i < ranked.length; i++) {
        if (opts.match(ranked[i])) {
          target = ranked[i];
          targetRank = i + 1;
          break;
        }
      }
      if (!target) {
        status.hidden = false;
        status.className = 'status error';
        status.innerHTML = '未找到' + opts.titleZh + '数据。请查看 <a href="https://defillama.com/cexs" target="_blank" rel="noopener">DefiLlama</a>';
        content.hidden = true;
        return;
      }

      var top = ranked.slice(0, 15);
      if (opts.pinTop) {
        top = top.filter(function (c) { return !opts.match(c); });
        top.unshift(target);
        if (top.length > 15) top = top.slice(0, 15);
      }

      var i24 = fmtInflow(target.inflows_24h);
      var i7 = fmtInflow(target.inflows_1w);
      var i30 = fmtInflow(target.inflows_1m);
      var siteUrl = target.url || opts.fallbackUrl || '#';

      var rAssets = rankByFieldMatch(cexs, 'currentTvl', opts.match);
      var rClean = rankByFieldMatch(cexs, 'cleanAssetsTvl', opts.match);
      var rSpot = rankByFieldMatch(cexs, 'spotVolume', opts.match);
      var rDeriv = rankByFieldMatch(cexs, 'derivVolume', opts.match);
      var rOi = rankByFieldMatch(cexs, 'oi', opts.match);

      var rows = top.map(function (c, idx) {
        var highlight = opts.match(c);
        var f24 = fmtInflow(c.inflows_24h);
        var f7 = fmtInflow(c.inflows_1w);
        var f30 = fmtInflow(c.inflows_1m);
        var nameHtml = c.url
          ? '<a href="' + c.url + '" target="_blank" rel="noopener">' + (c.name || '—') + '</a>'
          : (c.name || '—');
        var trueRank = trueRankMap[c.name + '|' + (c.slug || '')] || (idx + 1);
        // 置顶只改顺序，# 列仍用真实排名
        var displayRank = trueRank;
        var rankClass = 'rank' + (trueRank === 1 || (opts.pinTop && highlight) ? ' top' : '');
        return (
          '<tr class="' + (highlight ? 'highlight-row' : '') + '">' +
            '<td><span class="' + rankClass + '">' + displayRank + '</span></td>' +
            '<td><div class="name-cell">' + nameHtml + (highlight ? ' <span class="badge">' + opts.badge + '</span>' : '') + '</div></td>' +
            '<td>' + fmtUsd(c.currentTvl) + '</td>' +
            '<td>' + fmtUsd(c.cleanAssetsTvl) + '</td>' +
            '<td class="' + f24.cls + '">' + f24.text + '</td>' +
            '<td class="' + f7.cls + '">' + f7.text + '</td>' +
            '<td class="' + f30.cls + '">' + f30.text + '</td>' +
            '<td>' + fmtUsd(c.spotVolume) + '</td>' +
            '<td>' + fmtUsd(c.derivVolume) + '</td>' +
            '<td>' + fmtUsd(c.oi) + '</td>' +
          '</tr>'
        );
      }).join('');

      var heroBadge = opts.pinTop
        ? '#' + targetRank + ' · 榜单置顶'
        : '#' + targetRank;

      content.innerHTML =
        '<article class="hero">' +
          '<div class="hero-top">' +
            '<div class="hero-title">' +
              '<span class="badge">' + heroBadge + '</span>' +
              '<div>' +
                '<div class="hero-name">' + opts.titleZh + ' · ' + opts.titleEn + '</div>' +
                '<div class="hero-sub">DefiLlama 储备与交易数据</div>' +
              '</div>' +
            '</div>' +
            '<div class="hero-links">' +
              '<a href="https://defillama.com/cexs" target="_blank" rel="noopener">DefiLlama ↗</a>' +
              (siteUrl && siteUrl !== '#'
                ? '<a href="' + siteUrl + '" target="_blank" rel="noopener">' + opts.siteLabel + ' ↗</a>'
                : '') +
            '</div>' +
          '</div>' +
          '<div class="hero-grid">' +
            metricHtml('资产', fmtUsd(target.currentTvl), rAssets) +
