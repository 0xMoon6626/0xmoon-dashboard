<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>0xMoon专用数据看板</title>
  <style>
    :root {
      --bg: #07080d;
      --fg: #f4f6fb;
      --muted: #9aa3b5;
      --accent: #7c5cff;
      --border: rgba(255,255,255,0.1);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(124,92,255,0.22), transparent 60%),
        radial-gradient(800px 400px at 85% 110%, rgba(46,230,166,0.10), transparent 50%),
        var(--bg);
      color: var(--fg);
    }
    a { color: inherit; text-decoration: none; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(18px);
      background: rgba(7,8,13,0.78);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: stretch;
      gap: 8px;
    }
    .back {
      display: flex;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
      padding: 16px 8px 16px 0;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .back:hover { color: var(--fg); }

    .tabs {
      display: flex;
      flex: 1;
      gap: 4px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 16px 18px;
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color .15s ease, border-color .15s ease;
    }
    .tab:hover { color: var(--fg); }
    .tab.active {
      color: var(--fg);
      border-bottom-color: var(--accent);
    }

    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 20px 48px;
      min-height: 60vh;
    }
    .panel { display: none; }
    .panel.active { display: block; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="back" href="index.html">← 回首页</a>
      <nav class="tabs" role="tablist">
        <button class="tab active" type="button" data-tab="binance" role="tab" aria-selected="true">币安</button>
        <button class="tab" type="button" data-tab="htx" role="tab" aria-selected="false">火币</button>
        <button class="tab" type="button" data-tab="bnb" role="tab" aria-selected="false">BNB Chain</button>
        <button class="tab" type="button" data-tab="tron" role="tab" aria-selected="false">TRON</button>
      </nav>
    </div>
  </header>

  <main class="main">
    <section class="panel active" id="panel-binance" role="tabpanel"></section>
    <section class="panel" id="panel-htx" role="tabpanel"></section>
    <section class="panel" id="panel-bnb" role="tabpanel"></section>
    <section class="panel" id="panel-tron" role="tabpanel"></section>
  </main>

  <script>
    var tabs = document.querySelectorAll('.tab');
    var panels = {
      binance: document.getElementById('panel-binance'),
      htx: document.getElementById('panel-htx'),
      bnb: document.getElementById('panel-bnb'),
      tron: document.getElementById('panel-tron')
    };

    function activate(id) {
      tabs.forEach(function (t) {
        var on = t.getAttribute('data-tab') === id;
        t.classList.toggle('active', on);
        t.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      Object.keys(panels).forEach(function (k) {
        panels[k].classList.toggle('active', k === id);
      });
      history.replaceState(null, '', '#' + id);
    }

    tabs.forEach(function (t) {
      t.addEventListener('click', function () {
        activate(t.getAttribute('data-tab'));
      });
    });

    var hash = (location.hash || '#binance').slice(1);
    if (!panels[hash]) hash = 'binance';
    activate(hash);
  </script>
</body>
</html>
