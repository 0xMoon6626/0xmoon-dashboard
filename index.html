<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>0xMoon专用数据看板</title>
  <style>
    :root {
      --bg: #07080d;
      --fg: #f4f6fb;
      --muted: #9aa3b5;
      --accent: #7c5cff;
      --accent2: #2ee6a6;
      --border: rgba(255,255,255,0.1);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      font-family: "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(124,92,255,0.25), transparent 60%),
        radial-gradient(800px 400px at 80% 100%, rgba(46,230,166,0.12), transparent 50%),
        var(--bg);
      color: var(--fg);
      overflow: hidden;
    }
    #bg-words {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    #bg-words span {
      position: absolute;
      white-space: nowrap;
      font-weight: 700;
      user-select: none;
      line-height: 1;
      opacity: 0.18;
      transform-origin: center center;
      color: #c9d2ea;
    }
    .wrap {
      position: relative;
      z-index: 1;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .hero {
      width: min(720px, 100%);
      text-align: center;
      padding: 56px 28px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(12,14,22,0.82));
      backdrop-filter: blur(16px);
      box-shadow: 0 30px 80px rgba(0,0,0,0.45);
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      margin-bottom: 22px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 36px;
      font-size: clamp(28px, 6vw, 48px);
      line-height: 1.15;
      letter-spacing: 0.02em;
      font-weight: 700;
    }
    .btns {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }
    button, a.btn {
      appearance: none;
      border: none;
      cursor: pointer;
      text-decoration: none;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      border-radius: 14px;
      padding: 14px 22px;
      min-width: 148px;
      transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    }
    button:hover, a.btn:hover { transform: translateY(-1px); }
    button:active, a.btn:active { transform: translateY(1px); }
    .bye {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .bye:hover { color: var(--fg); border-color: rgba(255,255,255,0.25); }
    .enter {
      background: linear-gradient(135deg, var(--accent), #4f7cff);
      color: white;
      box-shadow: 0 12px 30px rgba(124,92,255,0.35);
    }
    .enter:hover { box-shadow: 0 16px 36px rgba(124,92,255,0.45); }
    .bye-screen {
      display: none;
      position: relative;
      z-index: 1;
      text-align: center;
      color: var(--muted);
      font-size: 18px;
    }
    .bye-screen.show { display: block; }
    .hero.hide { display: none; }
  </style>
</head>
<body>
  <div id="bg-words" aria-hidden="true"></div>
  <div class="wrap">
    <div class="hero" id="hero">
      <div class="badge">PRIVATE DASH</div>
      <h1>0xMoon专用数据看板</h1>
      <div class="btns">
        <button class="bye" type="button" id="btnBye">不看了</button>
        <a class="btn enter" href="data.html?v=21">谢谢爹</a>
      </div>
    </div>
    <div class="bye-screen" id="bye">
      好的，下次见～
    </div>
  </div>
  <script>
    document.getElementById('btnBye').addEventListener('click', function () {
      document.getElementById('hero').classList.add('hide');
      document.getElementById('bye').classList.add('show');
      try { window.close(); } catch (e) {}
    });

    (function scatterWords() {
      var phrases = [
        '卧槽', '太牛逼了', '夯爆了', '非常好看', '点赞',
        '绝了', '好顶赞', 'YYDS', '牛批', '冲冲冲',
        '爱了', '哇塞', '太强了', '炸裂', '妙啊',
        '好看', '真香', '起飞', '稳了', '无敌',
        '震撼', '绝绝子', '顶', '满分', '太会了'
      ];
      var colors = ['#c9d2ea', '#a78bfa', '#2ee6a6', '#7dd3fc', '#f9a8d4', '#fcd34d'];
      var layer = document.getElementById('bg-words');
      var W = window.innerWidth;
      var H = window.innerHeight;
      var placed = [];
      var maxTry = 40;
      var count = Math.min(80, Math.max(36, Math.floor((W * H) / 18000)));

      function overlaps(a, b, pad) {
        return !(
          a.right + pad < b.left ||
          a.left - pad > b.right ||
          a.bottom + pad < b.top ||
          a.top - pad > b.bottom
        );
      }

      for (var i = 0; i < count; i++) {
        var text = phrases[Math.floor(Math.random() * phrases.length)];
        var size = 14 + Math.random() * 42;
        var rot = (Math.random() * 50 - 25);
        var el = document.createElement('span');
        el.textContent = text;
        el.style.fontSize = size + 'px';
        el.style.color = colors[Math.floor(Math.random() * colors.length)];
        el.style.opacity = String(0.10 + Math.random() * 0.18);
        el.style.visibility = 'hidden';
        layer.appendChild(el);

        var ok = false;
        for (var t = 0; t < maxTry; t++) {
          var x = Math.random() * W;
          var y = Math.random() * H;
          el.style.left = x + 'px';
          el.style.top = y + 'px';
          el.style.transform = 'translate(-50%, -50%) rotate(' + rot + 'deg)';
          var r = el.getBoundingClientRect();
          // keep mostly on screen
          if (r.left < 4 || r.top < 4 || r.right > W - 4 || r.bottom > H - 4) continue;
          var box = { left: r.left, top: r.top, right: r.right, bottom: r.bottom };
          var clash = false;
          for (var j = 0; j < placed.length; j++) {
            if (overlaps(box, placed[j], 8)) { clash = true; break; }
          }
          if (!clash) {
            placed.push(box);
            el.style.visibility = 'visible';
            ok = true;
            break;
          }
        }
        if (!ok) layer.removeChild(el);
      }
    })();
  </script>
</body>
</html>
